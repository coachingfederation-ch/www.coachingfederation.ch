<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="100%" role="img" aria-label="Ad request lifecycle from draft to active, with decline branch and contract gate">
  <style>
    .l { font-family: var(--font-sans); font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .s { font-family: var(--font-sans); font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .b { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .w { stroke: hsl(var(--muted-foreground)); stroke-width: 1; fill: none; marker-end: url(#c); }
    .z { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .halo { paint-order: stroke; stroke: hsl(var(--background)); stroke-width: 3px; }
  </style>
  <defs>
    <marker id="c" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="z" x="8" y="16" width="290" height="80" rx="8"/>
  <text class="s" x="20" y="34">member area</text>
  <rect class="z" x="8" y="120" width="620" height="150" rx="8"/>
  <text class="s" x="20" y="140">staff cms</text>

  <rect class="b" x="24" y="46" width="112" height="36" rx="8"/>
  <text class="l" x="80" y="69" text-anchor="middle">draft</text>
  <rect class="b" x="170" y="46" width="112" height="36" rx="8"/>
  <text class="l" x="226" y="69" text-anchor="middle">submitted</text>
  <line class="w" x1="140" y1="64" x2="166" y2="64"/>

  <rect class="b" x="24" y="170" width="122" height="36" rx="8"/>
  <text class="l" x="85" y="193" text-anchor="middle">under review</text>
  <rect class="b" x="180" y="170" width="112" height="36" rx="8"/>
  <text class="l" x="236" y="193" text-anchor="middle">approved</text>
  <rect class="b" x="180" y="222" width="112" height="32" rx="16"/>
  <text class="l" x="236" y="243" text-anchor="middle">declined</text>

  <rect class="b" x="330" y="170" width="140" height="36" rx="8"/>
  <text class="l" x="400" y="193" text-anchor="middle">contract signed</text>
  <circle cx="326" cy="152" r="9" fill="hsl(var(--accent))"/>
  <text class="s" x="326" y="156" text-anchor="middle" fill="hsl(var(--accent-foreground))">1</text>

  <rect class="b" x="504" y="170" width="112" height="36" rx="8"/>
  <text class="l" x="560" y="193" text-anchor="middle">active</text>
  <rect class="b" x="504" y="222" width="112" height="32" rx="16"/>
  <text class="l" x="560" y="243" text-anchor="middle">expired</text>

  <line class="w" x1="226" y1="86" x2="120" y2="166"/>
  <line class="w" x1="150" y1="188" x2="176" y2="188"/>
  <line class="w" x1="150" y1="196" x2="176" y2="232"/>
  <line class="w" x1="296" y1="188" x2="326" y2="188"/>
  <line class="w" x1="474" y1="188" x2="500" y2="188"/>
  <line class="w" x1="560" y1="210" x2="560" y2="218" stroke-dasharray="4 3"/>

  <text class="s halo" x="560" y="284" text-anchor="middle">expiry is a date check, not a job</text>
  <text class="s halo" x="326" y="134" text-anchor="middle">1 placements are created here only</text>
</svg>
